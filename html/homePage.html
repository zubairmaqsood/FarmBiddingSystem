<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Bidding System</title>
    <link rel="stylesheet" href="../css/bootstrap/bootstrap.css" />
    <link rel="stylesheet" href="../css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/homePage.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg  sticky-top border-bottom nav">
      <div class="container-fluid">
        <div class="navbar-brand">
          <img
            src="../img/logo.webp"
            alt="logo"
            class=" brand-logo"
          />
          <span>Farm Bidding System</span>
        </div>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-controls="navbarContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse navContent" id="navbarContent">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link nav-link-underline me-3" href="homePage.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-underline me-3" href="aboutUs.html">About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-underline me-3" href="myBid.html">My Bid</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-link-underline me-3" href="#"
                >Contact us</a
              >
            </li>
          </ul>

          <div class="d-flex">
            <button class="btn btn-outline-success" id="navbarButton">logout</button>
          </div>

        </div>

      </div>
      
    </nav>

    <!-- Main Div -->
    <div class="container-fluid d-flex flex-column gap-4 mt-2">
      <!-- Image Section -->
      <div class="row mt-3">
        <div class="col-8 m-auto">
          <div
            id="mainCarousel"
            class="carousel slide w-75 mx-auto shadow rounded border overflow-hidden mainPicContainer"
            data-bs-ride="carousel"
          >
          <!-- Main pic indicator buttons -->
            <div class="carousel-indicators">
              <button
                type="button"
                data-bs-target="#mainCarousel"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="Slide 1"
              ></button>

              <button
                type="button"
                data-bs-target="#mainCarousel"
                data-bs-slide-to="1"
                aria-label="Slide 2"
              ></button>

              <button
                type="button"
                data-bs-target="#mainCarousel"
                data-bs-slide-to="2"
                aria-label="Slide 3"
              ></button>

              <button
                type="button"
                data-bs-target="#mainCarousel"
                data-bs-slide-to="3"
                aria-label="Slide 4"
              ></button>

            </div>

            <!-- Main Pics -->
            <div class="carousel-inner">
              <div class="carousel-item active" data-bs-interval="3000">
                <img
                  src="../img/mainPic1.webp"
                  class=" w-100 mainCarouselImg"
                  alt="First slide"
                />
              </div>

              <div class="carousel-item" data-bs-interval="3000">
                <img
                  src="../img/mainPic2.webp"
                  class=" w-100 mainCarouselImg"
                  alt="Second slide"
                />
              </div>

              <div class="carousel-item" data-bs-interval="3000">
                <img
                  src="../img/mainPic3.webp"
                  class=" w-100 mainCarouselImg"
                  alt="Third slide"
                />
              </div>

              <div class="carousel-item" data-bs-interval="3000">
                <img
                  src="../img/mainPic4.webp"
                  class=" w-100 mainCarouselImg"
                  alt="Fourth slide"
                />
              </div>

            </div>
          </div>
        </div>
      </div>

      <!-- Search bar -->
      <div class="container mt-4 mb-4">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">
            <form class="d-flex" onsubmit="search(event)">
              <div class="input-group shadow rounded-pill overflow-hidden border">
                <span class="input-group-text bg-white border-0 ps-4">
                  <img src="../img/searchbar-removebg-preview.png" alt="" style="width: 20; height: auto;">
                </span>
                
                <input 
                  class="form-control border-0 py-3 shadow-none" 
                  type="search" 
                  placeholder="Search auctions (e.g., Tomatoes, Wheat)..." 
                  aria-label="Search"
                  id="searchInput"
                  name="auction"
                >
                
                <button class="btn btn-success px-4 fw-bold" type="submit">
                  Search
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Search result Div -->
      <div id="searchResultsSection" class="container d-none min-vh-100">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold text-success">Search Results</h3>
            <span class="badge bg-secondary" id="resultCountBadge"></span>
        </div>
        
        <div class="row g-4" id="searchResultsGrid"></div>
        
        <div id="noResultsMsg" class="text-center mt-5">
            <h4 class="text-muted mt-3">No auctions found matching your search.</h4>
            <button class="btn btn-outline-success mt-2" onclick="clearSearch()">View All Auctions</button>
        </div>
      </div>

     <!-- Main Auctions Div -->
      <div id="mainAucContainer">
        <!-- Live Auction Section -->
        <div class="p-3">
          <h3>Live Auctions</h3>

          
          <div class="position-relative">
            <button
            class="btn btn-dark scrollButton left-btn"
              onclick="scrollContainer('liveAuction','left')"
              >
              &lt
            </button>

            <div
              class="d-flex flex-nowrap gap-4 scrollContainer position-relative pt-3" 
              id="liveAuction"
              >

              <!-- Loader -->

              <div class="w-100 d-flex justify-content-center align-items-center loadingSpinner">
                <div class="spinner-border text-success" style="width: 3rem; height: 3rem;">
                  
                </div>
            </div>

            </div>

            <button
              class="btn btn-dark scrollButton right-btn"
              onclick="scrollContainer('liveAuction','right')"
            >
              &gt
            </button>
          </div>
        </div>

        <!-- Ending Auction Section -->
        <div class="p-3">
          <h3>Ending soon</h3>

          <div class="position-relative">
            <button
              class="btn btn-dark scrollButton left-btn"
              onclick="scrollContainer('endingSoon','left')"
            >
              &lt
            </button>

            <div
              class="d-flex flex-nowrap scrollContainer position-relative gap-4 pt-3"
              id="endingSoon"
            >
              
              <!-- Loader -->

              <div class="w-100 d-flex justify-content-center align-items-center loadingSpinner">
                <div class="spinner-border text-success" style="width: 3rem; height: 3rem;" >
              
                </div>
              </div>

            </div>
            <button
              class="btn btn-dark scrollButton right-btn"
              onclick="scrollContainer('endingSoon','right')"
            >
              &gt
            </button>

        </div>
        </div>
      </div>
    </div>

    <!-- bid modal -->
    <div class="modal fade" id="bidModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title">Place Your Bid</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="bidForm">
              <input type="hidden" id="modalAucId" name="auc_id">
              
              <h4 id="modalAucTitle" class="text-center mb-3"></h4>
              
              <div class="mb-3">
                <label class="form-label">Current Highest Bid</label>
                <input type="text" class="form-control" id="modalHighestBid" readonly>
              </div>
              
              <div class="mb-3">
                <label class="form-label">Your Bid Amount (Rs)</label>
                <input type="number" class="form-control" name="bid_amount" required placeholder="Enter amount higher than current bid">
              </div>
              
              <div class="d-grid">
                <button type="submit" class="btn btn-success">Confirm Bid</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- login modal for unauthorized user -->
    <div class="modal fade" id="loginPromptModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center p-4">
          <div class="modal-header border-0 pb-0">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3 text-primary">
              <i class="bi bi-shield-lock-fill" style="font-size: 3rem;"></i>
            </div>
            <h4 class="fw-bold">Login Required</h4>
            <p class="text-muted">You need to be a registered Buyer to place a bid on this item.</p>
            
            <div class="d-grid gap-2 col-10 mx-auto mt-4">
              <a href="login.html" class="btn btn-primary btn-lg">
                Log In
              </a>
              <a href="signup.html" class="btn btn-outline-secondary">
                Create an Account
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/jquery/jquery-3.6.0.min.js"></script>
    <script src="../js/bootstrap/bootstrap.bundle.js"></script>
    <!-- <script src="js/bootstrap/bootstrap.min.js"></script> -->
    <script src="../js/homepage.js"></script>
  </body>
</html>
